<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#060b14"/>
      <stop offset="50%" style="stop-color:#0a1220"/>
      <stop offset="100%" style="stop-color:#060e18"/>
    </linearGradient>

    <!-- Node glow - cyan -->
    <filter id="glowCyan">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Node glow - teal -->
    <filter id="glowTeal">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle glow for lines -->
    <filter id="glowLine">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid pattern -->
    <pattern id="dotGrid" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="0.8" fill="#1a2540" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="480" fill="url(#bg)"/>
  <rect width="1200" height="480" fill="url(#dotGrid)"/>

  <!-- ===== STATE MACHINE PIPELINE (center) ===== -->

  <!-- Connecting lines between nodes -->
  <!-- Idea → Spec -->
  <line x1="218" y1="260" x2="314" y2="260" stroke="#0ef7c0" stroke-width="1.5" opacity="0.5" filter="url(#glowLine)"/>
  <!-- Spec → Task -->
  <line x1="382" y1="260" x2="478" y2="260" stroke="#0ef7c0" stroke-width="1.5" opacity="0.55" filter="url(#glowLine)"/>
  <!-- Task → Execution -->
  <line x1="546" y1="260" x2="672" y2="260" stroke="#00d4ff" stroke-width="2" opacity="0.7" filter="url(#glowLine)"/>
  <!-- Execution → Test -->
  <line x1="744" y1="260" x2="840" y2="260" stroke="#00d4ff" stroke-width="1.5" opacity="0.6" filter="url(#glowLine)"/>
  <!-- Test → Archive -->
  <line x1="908" y1="260" x2="1004" y2="260" stroke="#0ef7c0" stroke-width="1.5" opacity="0.5" filter="url(#glowLine)"/>

  <!-- Arrowheads on lines -->
  <polygon points="314,255 314,265 322,260" fill="#0ef7c0" opacity="0.6"/>
  <polygon points="478,255 478,265 486,260" fill="#0ef7c0" opacity="0.65"/>
  <polygon points="672,255 672,265 680,260" fill="#00d4ff" opacity="0.8"/>
  <polygon points="840,255 840,265 848,260" fill="#00d4ff" opacity="0.7"/>
  <polygon points="1004,255 1004,265 1012,260" fill="#0ef7c0" opacity="0.6"/>

  <!-- Node: Idea/Brainstorm -->
  <rect x="150" y="235" width="68" height="50" rx="10" fill="#0a1628" stroke="#4a9eff" stroke-width="1.2" opacity="0.85"/>
  <rect x="150" y="235" width="68" height="50" rx="10" fill="none" stroke="#4a9eff" stroke-width="0.5" opacity="0.3" filter="url(#glowCyan)"/>
  <!-- Brain icon (simplified) -->
  <circle cx="178" cy="255" r="4" fill="none" stroke="#4a9eff" stroke-width="1.2" opacity="0.7"/>
  <circle cx="184" cy="253" r="3" fill="none" stroke="#4a9eff" stroke-width="1" opacity="0.5"/>
  <circle cx="172" cy="253" r="3" fill="none" stroke="#4a9eff" stroke-width="1" opacity="0.5"/>
  <text x="184" y="276" text-anchor="middle" fill="#4a9eff" font-family="system-ui, sans-serif" font-size="7" opacity="0.7">Idea</text>

  <!-- Node: Spec/Design -->
  <rect x="322" y="235" width="60" height="50" rx="10" fill="#0a1628" stroke="#4a9eff" stroke-width="1.2" opacity="0.85"/>
  <rect x="322" y="235" width="60" height="50" rx="10" fill="none" stroke="#4a9eff" stroke-width="0.5" opacity="0.3" filter="url(#glowCyan)"/>
  <!-- Compass/design icon -->
  <circle cx="350" cy="253" r="5" fill="none" stroke="#4a9eff" stroke-width="1" opacity="0.6"/>
  <line x1="350" y1="248" x2="350" y2="258" stroke="#4a9eff" stroke-width="0.8" opacity="0.5"/>
  <line x1="345" y1="253" x2="355" y2="253" stroke="#4a9eff" stroke-width="0.8" opacity="0.5"/>
  <text x="352" y="276" text-anchor="middle" fill="#4a9eff" font-family="system-ui, sans-serif" font-size="7" opacity="0.7">Spec</text>

  <!-- Node: Task Plan -->
  <rect x="486" y="235" width="60" height="50" rx="10" fill="#0a1628" stroke="#0ef7c0" stroke-width="1.2" opacity="0.85"/>
  <rect x="486" y="235" width="60" height="50" rx="10" fill="none" stroke="#0ef7c0" stroke-width="0.5" opacity="0.3" filter="url(#glowTeal)"/>
  <!-- List/task icon -->
  <rect x="507" y="249" width="18" height="2" rx="1" fill="#0ef7c0" opacity="0.5"/>
  <rect x="507" y="254" width="12" height="2" rx="1" fill="#0ef7c0" opacity="0.4"/>
  <rect x="507" y="259" width="15" height="2" rx="1" fill="#0ef7c0" opacity="0.3"/>
  <text x="516" y="276" text-anchor="middle" fill="#0ef7c0" font-family="system-ui, sans-serif" font-size="7" opacity="0.7">Tasks</text>

  <!-- Node: Execution (highlighted - central) -->
  <rect x="672" y="225" width="72" height="70" rx="12" fill="#0a1a30" stroke="#00d4ff" stroke-width="2" opacity="0.95"/>
  <rect x="672" y="225" width="72" height="70" rx="12" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.5" filter="url(#glowCyan)"/>
  <!-- Code brackets icon -->
  <text x="695" y="255" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="16" opacity="0.8" font-weight="bold">&lt;/&gt;</text>
  <text x="708" y="276" text-anchor="middle" fill="#00d4ff" font-family="system-ui, sans-serif" font-size="7" opacity="0.8">Build</text>

  <!-- Node: Test -->
  <rect x="840" y="235" width="68" height="50" rx="10" fill="#0a1628" stroke="#00d4ff" stroke-width="1.2" opacity="0.85"/>
  <rect x="840" y="235" width="68" height="50" rx="10" fill="none" stroke="#00d4ff" stroke-width="0.5" opacity="0.3" filter="url(#glowCyan)"/>
  <!-- Checkmark icon -->
  <polyline points="860,256 868,263 880,251" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.6"/>
  <text x="874" y="276" text-anchor="middle" fill="#00d4ff" font-family="system-ui, sans-serif" font-size="7" opacity="0.7">Test</text>

  <!-- Node: Archive -->
  <rect x="1004" y="235" width="60" height="50" rx="10" fill="#0a1628" stroke="#0ef7c0" stroke-width="1.2" opacity="0.85"/>
  <rect x="1004" y="235" width="60" height="50" rx="10" fill="none" stroke="#0ef7c0" stroke-width="0.5" opacity="0.3" filter="url(#glowTeal)"/>
  <!-- Archive/box icon -->
  <rect x="1026" y="251" width="16" height="12" rx="1.5" fill="none" stroke="#0ef7c0" stroke-width="1" opacity="0.6"/>
  <line x1="1026" y1="256" x2="1042" y2="256" stroke="#0ef7c0" stroke-width="0.8" opacity="0.4"/>
  <text x="1034" y="276" text-anchor="middle" fill="#0ef7c0" font-family="system-ui, sans-serif" font-size="7" opacity="0.7">Archive</text>

  <!-- ===== DUAL AGENT ICONS (above pipeline) ===== -->

  <!-- ClaudeCode - Left: Thinking/Strategy (brain + lightbulb feel) -->
  <g transform="translate(300, 100)">
    <!-- Outer glow ring -->
    <circle cx="0" cy="0" r="42" fill="none" stroke="#4a9eff" stroke-width="0.8" opacity="0.15"/>
    <circle cx="0" cy="0" r="38" fill="#0a1628" stroke="#4a9eff" stroke-width="1" opacity="0.7"/>
    <!-- Brain-style pattern inside -->
    <circle cx="0" cy="-6" r="9" fill="none" stroke="#4a9eff" stroke-width="1.2" opacity="0.6"/>
    <circle cx="0" cy="-6" r="3" fill="#4a9eff" opacity="0.3"/>
    <!-- Thinking lines radiating -->
    <line x1="16" y1="-18" x2="22" y2="-24" stroke="#4a9eff" stroke-width="1.5" opacity="0.4" stroke-linecap="round"/>
    <line x1="20" y1="-10" x2="28" y2="-12" stroke="#4a9eff" stroke-width="1.5" opacity="0.3" stroke-linecap="round"/>
    <line x1="18" y1="-2" x2="26" y2="0" stroke="#4a9eff" stroke-width="1.5" opacity="0.25" stroke-linecap="round"/>
  </g>
  <text x="300" y="170" text-anchor="middle" fill="#4a9eff" font-family="system-ui, sans-serif" font-size="11" opacity="0.6" letter-spacing="2">PLAN</text>

  <!-- Codex - Right: Execute/Build (gear + bracket feel) -->
  <g transform="translate(920, 100)">
    <circle cx="0" cy="0" r="42" fill="none" stroke="#00d4ff" stroke-width="0.8" opacity="0.15"/>
    <circle cx="0" cy="0" r="38" fill="#0a1628" stroke="#00d4ff" stroke-width="1" opacity="0.7"/>
    <!-- Gear-style pattern -->
    <circle cx="0" cy="0" r="9" fill="none" stroke="#00d4ff" stroke-width="1.2" opacity="0.6"/>
    <circle cx="0" cy="0" r="3" fill="#00d4ff" opacity="0.3"/>
    <!-- Gear teeth -->
    <rect x="-2" y="-16" width="4" height="7" rx="1" fill="#00d4ff" opacity="0.4"/>
    <rect x="-2" y="9" width="4" height="7" rx="1" fill="#00d4ff" opacity="0.4"/>
    <rect x="-16" y="-2" width="7" height="4" rx="1" fill="#00d4ff" opacity="0.4"/>
    <rect x="9" y="-2" width="7" height="4" rx="1" fill="#00d4ff" opacity="0.4"/>
    <!-- Diagonal teeth -->
    <rect x="8" y="-13" width="4" height="6" rx="1" fill="#00d4ff" opacity="0.3" transform="rotate(45 10 -10)"/>
    <rect x="-14" y="7" width="4" height="6" rx="1" fill="#00d4ff" opacity="0.3" transform="rotate(45 -12 10)"/>
  </g>
  <text x="920" y="170" text-anchor="middle" fill="#00d4ff" font-family="system-ui, sans-serif" font-size="11" opacity="0.6" letter-spacing="2">BUILD</text>

  <!-- ===== CONNECTION BETWEEN PLAN AND BUILD (brain to gear) ===== -->
  <line x1="338" y1="110" x2="882" y2="110" stroke="#1a3050" stroke-width="1" opacity="0.3" stroke-dasharray="4,8"/>
  <!-- Small diamond in the middle of the connection -->
  <rect x="604" y="106" width="8" height="8" rx="1.5" fill="none" stroke="#0ef7c0" stroke-width="0.8" opacity="0.35" transform="rotate(45 608 110)"/>

  <!-- ===== SUBTLE DECORATIVE ELEMENTS ===== -->
  <!-- Top-right accent dots -->
  <circle cx="1100" cy="40" r="1.5" fill="#00d4ff" opacity="0.2"/>
  <circle cx="1120" cy="55" r="1" fill="#0ef7c0" opacity="0.15"/>
  <circle cx="1080" cy="60" r="0.8" fill="#4a9eff" opacity="0.15"/>

  <!-- Bottom-left accent dots -->
  <circle cx="80" cy="440" r="1.5" fill="#0ef7c0" opacity="0.2"/>
  <circle cx="100" cy="425" r="1" fill="#00d4ff" opacity="0.15"/>
  <circle cx="120" cy="445" r="0.8" fill="#4a9eff" opacity="0.15"/>

  <!-- AI Harness title - subtle -->
  <text x="600" y="400" text-anchor="middle" fill="#2a4060" font-family="system-ui, sans-serif" font-size="14" letter-spacing="8" opacity="0.5">AI &nbsp; HARNESS</text>

  <!-- Bottom separator line -->
  <line x1="440" y1="415" x2="760" y2="415" stroke="#1a3050" stroke-width="0.5" opacity="0.4"/>
</svg>
